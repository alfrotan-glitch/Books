name: Build and validate histology book

concurrency:
  group: histology-publication-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - arena/8f31a7ed-books
    paths:
      - 'junqueira-exam-guide/src/**'
      - 'junqueira-exam-guide/build*.py'
      - 'junqueira-exam-guide/tools/validate_epub.py'
      - 'junqueira-exam-guide/tools/release_smoke_test.py'
      - 'junqueira-exam-guide/tools/write_release_manifest.py'
      - 'junqueira-exam-guide/tools/make_study_decks.py'
      - 'junqueira-exam-guide/tools/make_question_bank.py'
      - 'junqueira-exam-guide/tools/validate_study_materials.py'
      - 'junqueira-exam-guide/tools/validate_scientific_corrections.py'
      - 'junqueira-exam-guide/tools/generate_atlas.py'
      - 'junqueira-exam-guide/data/extra_cards.tsv'
      - '.github/workflows/histology-book.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'junqueira-exam-guide/src/**'
      - 'junqueira-exam-guide/build*.py'
      - 'junqueira-exam-guide/tools/validate_epub.py'
      - 'junqueira-exam-guide/tools/release_smoke_test.py'
      - 'junqueira-exam-guide/tools/write_release_manifest.py'
      - '.github/workflows/histology-book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: junqueira-exam-guide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install reportlab pypandoc_binary python-docx pypdfium2 pymupdf
      - name: Regenerate study materials from the canonical manuscript
        run: |
          python tools/make_study_decks.py
          python tools/make_question_bank.py
          python tools/validate_study_materials.py
          python tools/validate_scientific_corrections.py
      - name: Rebuild publication files
        run: |
          python build.py
          python build_docs.py
          python build_epub.py
          python tools/validate_epub.py
          python tools/release_smoke_test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate EPUB with official W3C EPUBCheck 5.4.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/epubcheck-5.4.0.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          mkdir -p /tmp/epubcheck-release
          unzip -q /tmp/epubcheck-5.4.0.zip -d /tmp/epubcheck-release
          JAR="$(find /tmp/epubcheck-release -type f -name epubcheck.jar -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" Basic_Histology_Learning_Text.epub
      - name: Record publication file hashes and provenance
        run: python tools/write_release_manifest.py
      - name: Check all outputs exist
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path("Basic_Histology_Learning_Text")
          for ext in (".pdf", ".docx", ".epub", ".html"):
              p = base.with_suffix(ext)
              assert p.exists() and p.stat().st_size > 1000, f"Missing or empty: {p}"
              print(p, p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: basic-histology-learning-text
          path: |
            junqueira-exam-guide/Basic_Histology_Learning_Text.pdf
            junqueira-exam-guide/Basic_Histology_Learning_Text.docx
            junqueira-exam-guide/Basic_Histology_Learning_Text.epub
            junqueira-exam-guide/Basic_Histology_Learning_Text.html
            junqueira-exam-guide/publication-manifest.json
            junqueira-exam-guide/build/atlas/*.png
            junqueira-exam-guide/deliverables/junqueira_flashcards.csv
            junqueira-exam-guide/deliverables/junqueira_question_bank.csv
          if-no-files-found: error

      - name: Synchronize current-source outputs without binary rebase conflicts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            Basic_Histology_Learning_Text.pdf
            Basic_Histology_Learning_Text.docx
            Basic_Histology_Learning_Text.epub
            Basic_Histology_Learning_Text.html
            publication-manifest.json
            deliverables/junqueira_flashcards.csv
            deliverables/junqueira_question_bank.csv
          )
          # Keep the validated build outside the checkout. Rebase of
          # timestamp-bearing PDFs and EPUBs produces binary conflicts.
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          cp --parents "${files[@]}" "$snapshot"

          for attempt in 1 2 3; do
            git fetch origin main
            # A newer source edit must build its own outputs. Never publish
            # an old CI artifact over a newer manuscript or build script.
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- \
                 src build.py build_docs.py build_epub.py tools data/extra_cards.tsv; then
              echo "Newer publication source detected; skip stale output sync."
              exit 0
            fi

            git reset --hard origin/main
            for file in "${files[@]}"; do
              mkdir -p "$(dirname "$file")"
              cp "$snapshot/$file" "$file"
            done
            git add -f -- "${files[@]}"
            if git diff --cached --quiet; then
              echo "Current publication assets already match this build."
              exit 0
            fi
            git commit -m "Sync generated histology publication and study assets [skip ci]"
            if git push origin HEAD:main; then
              echo "Publication outputs synchronized successfully."
              exit 0
            fi
            echo "Non-fast-forward push on attempt $attempt; retrying from remote main."
          done
          echo "Could not synchronize publication after three safe attempts." >&2
          exit 1
